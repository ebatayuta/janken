<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Janken</title>
</head>

<body>
  <h1>じゃんけんページ</h1>
  <div th:if="${greeting}">
    [[${greeting}]]<br>
  </div>

  <h3>エントリー [[${login_user}]]</h3>

  <div th:each="user:${users}">
    ・[[${user.userName}]]
  </div>

  <h3>試合結果</h3>

  <div th:each="match:${matches}">
    id:[[${match.id}]] user1:[[${match.user1}]] user2:[[${match.user2}]] user1の手:[[${match.user1Hand}]]
    user2の手:[[${match.user2Hand}]]
  </div>

  <div th:if="${room}">
    <ul>
      <li th:each="user : ${room.users}">[[${user}]]</li>
    </ul>
  </div>

  <form th:action="@{/janken/playJanken}" method="post">
    出す手を選択
    <br>
    <label><input type="radio" name="hand" value="グー">グー</label>
    <label><input type="radio" name="hand" value="チョキ">チョキ</label>
    <label><input type="radio" name="hand" value="パー">パー</label>
    <br>
    <input type="submit" value="じゃんけん!">
  </form>

  <div th:if="${result}">
    <br>あなたの手：[[${pHand}]]
    <br>相手の手：[[${cHand}]]
    <br>結果：[[${result}]]
  </div>

  <br>
  <div><a href="/logout">ログアウト</a></div>
</body>


</html>
