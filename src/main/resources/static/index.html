<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Janken_Name</title>
</head>

<body>
  <h1>あなたの名前を入力してください</h1>
  <p>
    <!--form actionが処理を渡す先を示す
        input nameがパラメータ名を表している
      この場合，kakeru1,kakeru2の2つの変数が/sample25にpost メソッドで渡される-->
  <form action="/janken" method="post">
    <input type="text" name="name" />
    <input type="submit" value="参加">
  </form>
  </p>
</body>

</html>
